---
name: get_gene_qc
runner_type: python-script
description: Get gene qc data from Cleve
entry_point: "cleve_request.py"
enabled: true
parameters:
  api_key:
    description: Cleve API key
    type: string
    secret: true
    required: false
  gene:
    description: Gene symbol for the gene to fetch qc data for.
    type: string
    required: true
  endpoint:
    description: Cleve API endpoint
    type: string
    default: "geneqc/{{ gene }}"
    immutable: true
    required: true
  method:
    description: HTTP method
    type: string
    default: GET
    immutable: true
    required: true